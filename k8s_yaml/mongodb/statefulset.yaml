apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-metadata-name-mongodb
  namespace: mongodb
spec:
  serviceName: "service-metada-name-mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: stateful-spec-template-app-mongodb
  template:
    metadata:
      labels:
        app: stateful-spec-template-app-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_DATABASE
              value: NoteKeep
          volumeMounts:
            - name: pg-data
              mountPath: /data/db
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: mongodb-data-postgres-0
