services:
  app:
    image: ghcr.io/fethullahcucu/notekeep:main
    ports:
      - 8080:8080
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/NoteKeep
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_vision_api
    # secrets:
    #   - google_vision_api
    extra_hosts:
      - "host.docker.internal:host-gateway"

