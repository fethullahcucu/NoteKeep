<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteKeep - Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/notekeep-theme.css}">
</head>
<body>
<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/notes}">NoteKeep</a>
        <div class="navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li>
                    <a class="nav-link" th:href="@{/notes}">Notes</a>
                </li>
                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
    <div class="card">
        <div class="card-header">
            <h2 style="margin: 0; color: var(--accent);">Manage Users</h2>
        </div>
        <div class="card-body">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">id</td>
                        <td th:text="${user.firstName}">firstName</td>
                        <td th:text="${user.lastName}">lastName</td>
                        <td th:text="${user.email}">email</td>
                        <td>
                            <span th:each="role : ${user.roles}" class="badge bg-info" th:text="${role}" style="margin-right: 0.25rem;">role</span>
                        </td>
                        <td>
                            <a th:href="@{|/admin/users/${user.id}/edit|}" class="btn btn-sm btn-warning">Edit</a>
                            <form th:action="@{|/admin/users/${user.id}/delete|}" method="post" style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this user and all their notes?');">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
