<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteKeep - Login</title>
    <link rel="stylesheet" th:href="@{/css/notekeep-theme.css}">
</head>
<body>
<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="${#httpServletRequest != null and #httpServletRequest.remoteUser != null} ? @{/notes} : @{/notekeep}">
            NoteKeep
        </a>
        <span class="navbar-text">
            Pod: <span class="badge bg-warning" th:text="${podName}">pod-name</span>
        </span>
    </div>
</nav>

<div class="center-wrapper">
    <div class="card-container">
        <div th:if="${param.error}" class="alert alert-danger">
            Invalid Email or Password
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out.
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Login</h2>
            </div>
            <div class="card-body">
                <form method="post" th:action="@{/notekeep}">
                    <div class="form-group">
                        <label class="control-label">Email</label>
                        <input type="text" id="email" name="email" class="form-control" placeholder="Enter email address" required />
                    </div>

                    <div class="form-group">
                        <label class="control-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required />
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </div>

                    <div class="form-group text-center">
                        <span style="color: var(--text-muted);">Not registered?
                            <a th:href="@{/register}">Create account</a>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
