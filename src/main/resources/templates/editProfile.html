<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteKeep - Edit Profile</title>
    <link rel="stylesheet" th:href="@{/css/notekeep-theme.css}">
</head>
<body>
<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/notes}">NoteKeep</a>
        <div class="navbar-collapse">
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
            </form>
            <span class="navbar-text ms-3">Pod: <span class="badge bg-warning" th:text="${podName}">pod-name</span></span>
        </div>
    </div>
</nav>

<div class="center-wrapper">
    <div class="card-container">
        <div class="card">
            <div class="card-header"><h2 class="text-center">Edit Profile</h2></div>
            <div class="card-body">
                <div th:if="${param.success}" class="alert alert-success">
                    Profile updated successfully.
                </div>

                <form th:action="@{/profile/update}" th:object="${user}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-group">
                        <label for="firstName" class="form-label">First Name</label>
                        <input id="firstName" type="text" th:field="*{firstName}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input id="lastName" type="text" th:field="*{lastName}" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" th:field="*{email}" class="form-control" readonly>
                        <small style="color: var(--text-muted); display: block; margin-top: 0.25rem;">Email is used as your login and cannot be changed.</small>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">New Password</label>
                        <input id="password" type="password" th:field="*{password}" class="form-control" placeholder="Leave blank to keep current password">
                    </div>

                    <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a th:href="@{/notes}" class="btn btn-secondary">Back to Notes</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
