<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteKeep - Edit Note</title>
    <link rel="stylesheet" th:href="@{/css/notekeep-theme.css}">
</head>
<body>
<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/notes}">NoteKeep</a>
        <div class="navbar-collapse">
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
            </form>
            <span class="navbar-text ms-3">Pod: <span class="badge bg-warning" th:text="${podName}">pod-name</span></span>
            <span th:if="${isAdmin}" class="badge bg-info ms-2">Admin</span>
        </div>
    </div>
</nav>

<div class="center-wrapper">
    <div class="card-container">
        <div class="card">
            <div class="card-header"><h2 class="text-center">Edit Note</h2></div>
            <div class="card-body">
                <dl th:if="${isAdmin}" class="note-metadata mb-3">
                    <div>
                        <dt>Note ID</dt>
                        <dd th:text="${note.id}">note-id</dd>
                    </div>
                    <div>
                        <dt>User ID</dt>
                        <dd th:text="${note.userId}">user-id</dd>
                    </div>
                    <div>
                        <dt>Created</dt>
                        <dd th:text="${note.createdAt} ?: 'not recorded'">created</dd>
                    </div>
                    <div>
                        <dt>Updated</dt>
                        <dd th:text="${note.updatedAt} ?: 'not recorded'">updated</dd>
                    </div>
                </dl>
                <form th:action="@{/notes/update}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="noteId" th:value="${note.id}" />

                    <div class="form-group">
                        <label for="title" class="form-label">Title</label>
                        <input id="title" type="text" name="title" class="form-control" th:value="${note.title}" required>
                    </div>

                    <div class="form-group">
                        <label for="content" class="form-label">Content</label>
                        <textarea id="content" name="content" class="form-control" rows="6" required th:text="${note.content}"></textarea>
                    </div>

                    <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a th:href="@{/notes}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
