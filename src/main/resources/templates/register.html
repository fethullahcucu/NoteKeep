<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteKeep - Register</title>
    <link rel="stylesheet" th:href="@{/css/notekeep-theme.css}">
</head>
<body>
<nav class="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/notekeep}">NoteKeep</a>
        <span class="navbar-text">
            Pod: <span class="badge bg-warning" th:text="${podName}">pod-name</span>
        </span>
    </div>
</nav>

<div class="center-wrapper">
    <div class="card-container">
        <div th:if="${param.success}" class="alert alert-success">
            You have successfully registered! <a th:href="@{/notekeep}">Login here</a>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Create Account</h2>
            </div>
            <div class="card-body">
                <form method="post" th:action="@{/register/save}" th:object="${user}">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input class="form-control" id="firstName" name="firstName" placeholder="Enter first name"
                               th:field="*{firstName}" type="text" required />
                        <p th:errors="*{firstName}" class="text-danger" th:if="${#fields.hasErrors('firstName')}"></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input class="form-control" id="lastName" name="lastName" placeholder="Enter last name"
                               th:field="*{lastName}" type="text" required />
                        <p th:errors="*{lastName}" class="text-danger" th:if="${#fields.hasErrors('lastName')}"></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input class="form-control" id="email" name="email" placeholder="Enter email address"
                               th:field="*{email}" type="email" required />
                        <p th:errors="*{email}" class="text-danger" th:if="${#fields.hasErrors('email')}"></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input class="form-control" id="password" name="password" placeholder="Enter password"
                               th:field="*{password}" type="password" required />
                        <p th:errors="*{password}" class="text-danger" th:if="${#fields.hasErrors('password')}"></p>
                    </div>

                    <div class="form-group">
                        <button class="btn btn-primary w-100" type="submit">Register</button>
                    </div>

                    <div class="form-group text-center">
                        <span style="color: var(--text-muted);">Already have an account?
                            <a th:href="@{/notekeep}">Sign in</a>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
